[package]
name = "straylight"
version = "0.11.1"
description = "Lightweight SSH file manager, terminal, and code viewer"
authors = ["Straylight contributors"]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Yooouuuuuuu/straylight"
default-run = "straylight"

[lib]
name = "straylight_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon` is a `tauri` feature. File operations go through our own transport
# commands (see src/transport), so the `dialog`/`fs` plugin crates aren't used.
tauri = { version = "2", features = ["tray-icon"] }
# Persist window size/position/maximized across launches.
tauri-plugin-window-state = "2"
# Auto-update from GitHub Releases (verifies each update's signature against the
# pubkey baked into tauri.conf.json); process = relaunch after an update installs.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Native OS clipboard read/write — avoids the WebView2 "allow clipboard" prompt
# that navigator.clipboard.readText() triggers on first paste.
tauri-plugin-clipboard-manager = "2"

# SSH / SFTP. russh 0.6x: keys live in `russh::keys` (ssh-key based; the old
# russh-keys crate is merged). Non-default `ring` backend — the default
# aws-lc-rs needs a C toolchain dance MSVC fails at; ring is what 0.46 used.
# No compression is ever offered: zlib@openssh.com is broken in russh against
# OpenSSH 9.6 strict-kex (0.46: died at rekey; 0.62: first channel_open hangs
# — docs/dev/russh-upgrade.md), and OpenSSH itself defaults compression off.
# (~/.ssh/config is parsed manually in ssh/config.rs — the russh-config crate can
# only resolve a single named host, not enumerate every Host block, so it isn't
# used here.)
russh = { version = "0.62", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "2"

# Local PTY (ConPTY on Windows) for the local terminal.
portable-pty = "0.8"

# Filesystem watcher for local repos (live VC status, VS Code-style).
notify = "8"

tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"

keyring = "3"
directories = "5"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
log = "0.4"
env_logger = "0.11"
# Carry a WSL-generated private key out of the distro without newline mangling.
base64 = "0.22"

[features]
# Lets the rekeytest example OFFER zlib, to reproduce the russh zlib+strict-kex
# break (docs/dev/russh-upgrade.md). Never enabled in product builds — no lane
# offers compression, and leaving the flate2 code out makes that structural.
zlib-diag = ["russh/flate2"]

[[example]]
name = "rekeytest"
required-features = ["zlib-diag"]

# Real Windows build number for xterm's ConPTY reflow heuristics (no process
# spawn — a GUI app shelling out to `cmd /c ver` can flash a console).
[target.'cfg(windows)'.dependencies]
windows-version = "0.1"

[profile.release]
# Optimize for a small installer, matching Straylight's goals.
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# Dependencies get full optimization even in dev builds. Debug-profile crypto
# ran at ~8 MB/s (russh's chacha20/aes in opt-level 0) vs 330 MB/s in release —
# every `tauri dev` transfer was CPU-bound on unoptimized cipher code, which
# masqueraded as a network/protocol problem for an entire hunt. Our own crate
# stays at opt-level 0 for fast incremental rebuilds and real debugging.
[profile.dev.package."*"]
opt-level = 3
